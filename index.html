<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Pong</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.game{
    width:95%;
    max-width:950px;
    text-align:center;
}

h1{
    font-size:40px;
    letter-spacing:5px;
    margin-bottom:15px;
}

.scoreboard{
    display:flex;
    justify-content:space-around;
    margin-bottom:15px;
}

.score{
    display:block;
    font-size:42px;
    font-weight:bold;
}

canvas{
    width:100%;
    background:#000;
    border:3px solid white;
    display:block;
}

#message{
    margin:12px;
    font-size:20px;
    font-weight:bold;
}

button,select{
    padding:10px 16px;
    margin:5px;
    background:#000;
    color:white;
    border:2px solid white;
    border-radius:6px;
    cursor:pointer;
}

button:hover,select:hover{
    background:white;
    color:black;
}

/* UP DOWN BUTTONS */
.controls{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:15px;
}

.control-btn{
    width:100px;
    height:60px;
    font-size:30px;
    font-weight:bold;
    touch-action:none;
    user-select:none;
}

.instructions{
    margin-top:10px;
    color:#aaa;
}

@media(max-width:600px){
    h1{
        font-size:28px;
    }

    .score{
        font-size:32px;
    }

    .control-btn{
        width:120px;
        height:65px;
    }
}
</style>
</head>

<body>

<div class="game">

<h1>NEON PONG</h1>

<div class="scoreboard">
    <div>
        PLAYER
        <span id="playerScore" class="score">0</span>
    </div>

    <div>
        AI
        <span id="aiScore" class="score">0</span>
    </div>
</div>

<canvas id="canvas" width="900" height="500"></canvas>

<div id="message">Press START to play</div>

<div>
    <button id="start">START</button>
    <button id="pause">PAUSE</button>
    <button id="restart">RESTART</button>

    <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
    </select>
</div>

<!-- UP DOWN BUTTONS -->
<div class="controls">
    <button class="control-btn" id="up">▲</button>
    <button class="control-btn" id="down">▼</button>
</div>

<div class="instructions">
    Use UP and DOWN buttons to move your paddle
</div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let playerScore = 0;
let aiScore = 0;

let running = false;
let paused = false;

const player = {
    x:25,
    y:200,
    w:15,
    h:100,
    speed:8
};

const ai = {
    x:W-40,
    y:200,
    w:15,
    h:100
};

const ball = {
    x:W/2,
    y:H/2,
    r:9,
    dx:6,
    dy:3
};

let movingUp = false;
let movingDown = false;


/* DRAW GAME */

function draw(){

    ctx.clearRect(0,0,W,H);

    /* Background */
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);

    /* Center line */
    ctx.strokeStyle="#555";
    ctx.setLineDash([10,10]);
    ctx.beginPath();
    ctx.moveTo(W/2,0);
    ctx.lineTo(W/2,H);
    ctx.stroke();
    ctx.setLineDash([]);

    /* Player */
    ctx.fillStyle="white";
    ctx.fillRect(
        player.x,
        player.y,
        player.w,
        player.h
    );

    /* AI */
    ctx.fillRect(
        ai.x,
        ai.y,
        ai.w,
        ai.h
    );

    /* Ball */
    ctx.beginPath();
    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.fillStyle="white";
    ctx.fill();
}


/* MOVE PLAYER */

function movePlayer(){

    if(movingUp){
        player.y -= player.speed;
    }

    if(movingDown){
        player.y += player.speed;
    }

    /* Keep paddle inside screen */

    player.y = Math.max(
        0,
        Math.min(H-player.h,player.y)
    );
}


/* MOVE AI */

function moveAI(){

    let difficulty =
        document.getElementById("difficulty").value;

    let speed = 4;

    if(difficulty === "easy"){
        speed = 3;
    }

    if(difficulty === "medium"){
        speed = 5;
    }

    if(difficulty === "hard"){
        speed = 7;
    }

    if(ai.y + ai.h/2 < ball.y){
        ai.y += speed;
    }

    if(ai.y + ai.h/2 > ball.y){
        ai.y -= speed;
    }

    ai.y = Math.max(
        0,
        Math.min(H-ai.h,ai.y)
    );
}


/* RESET BALL */

function resetBall(direction){

    ball.x = W/2;
    ball.y = H/2;

    ball.dx = 6 * direction;

    ball.dy =
        (Math.random()*6)-3;
}


/* COLLISION */

function collision(p){

    return (
        ball.x-ball.r < p.x+p.w &&
        ball.x+ball.r > p.x &&
        ball.y-ball.r < p.y+p.h &&
        ball.y+ball.r > p.y
    );
}


/* MOVE BALL */

function moveBall(){

    ball.x += ball.dx;
    ball.y += ball.dy;

    /* Top and bottom */

    if(
        ball.y-ball.r <= 0 ||
        ball.y+ball.r >= H
    ){
        ball.dy *= -1;
    }

    /* Player collision */

    if(
        collision(player) &&
        ball.dx < 0
    ){

        ball.dx *= -1;

        let hit =
            (ball.y -
            (player.y + player.h/2))
            /(player.h/2);

        ball.dy = hit * 6;
    }

    /* AI collision */

    if(
        collision(ai) &&
        ball.dx > 0
    ){

        ball.dx *= -1;

        let hit =
            (ball.y -
            (ai.y + ai.h/2))
            /(ai.h/2);

        ball.dy = hit * 6;
    }

    /* AI scores */

    if(ball.x < 0){

        aiScore++;

        document.getElementById(
            "aiScore"
        ).textContent = aiScore;

        resetBall(1);

        checkWinner();
    }

    /* Player scores */

    if(ball.x > W){

        playerScore++;

        document.getElementById(
            "playerScore"
        ).textContent = playerScore;

        resetBall(-1);

        checkWinner();
    }
}


/* CHECK WINNER */

function checkWinner(){

    if(playerScore >= 10){

        gameOver("YOU WIN!");

    }

    if(aiScore >= 10){

        gameOver("AI WINS!");

    }
}


/* START */

function startGame(){

    if(!running){

        running = true;
        paused = false;

        document.getElementById(
            "message"
        ).textContent = "Game Started";

    }
}


/* PAUSE */

function pauseGame(){

    if(running){

        paused = !paused;

        document.getElementById(
            "message"
        ).textContent =
            paused ? "PAUSED" : "Game Running";
    }
}


/* RESTART */

function restartGame(){

    playerScore = 0;
    aiScore = 0;

    document.getElementById(
        "playerScore"
    ).textContent = "0";

    document.getElementById(
        "aiScore"
    ).textContent = "0";

    player.y = H/2 - player.h/2;
    ai.y = H/2 - ai.h/2;

    resetBall(
        Math.random() < 0.5 ? 1 : -1
    );

    running = true;
    paused = false;

    document.getElementById(
        "message"
    ).textContent = "Game Started";
}


/* GAME OVER */

function gameOver(text){

    running = false;

    document.getElementById(
        "message"
    ).textContent = text;
}


/* =========================
   UP BUTTON
========================= */

const upButton =
    document.getElementById("up");

upButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();
        movingUp = true;

    }
);

upButton.addEventListener(
    "pointerup",
    function(){

        movingUp = false;

    }
);

upButton.addEventListener(
    "pointerleave",
    function(){

        movingUp = false;

    }
);

upButton.addEventListener(
    "pointercancel",
    function(){

        movingUp = false;

    }
);


/* =========================
   DOWN BUTTON
========================= */

const downButton =
    document.getElementById("down");

downButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();
        movingDown = true;

    }
);

downButton.addEventListener(
    "pointerup",
    function(){

        movingDown = false;

    }
);

downButton.addEventListener(
    "pointerleave",
    function(){

        movingDown = false;

    }
);

downButton.addEventListener(
    "pointercancel",
    function(){

        movingDown = false;

    }
);


/* KEYBOARD SUPPORT */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "ArrowUp"){
            movingUp = true;
        }

        if(e.key === "ArrowDown"){
            movingDown = true;
        }

    }
);

document.addEventListener(
    "keyup",
    function(e){

        if(e.key === "ArrowUp"){
            movingUp = false;
        }

        if(e.key === "ArrowDown"){
            movingDown = false;
        }

    }
);


/* BUTTONS */

document.getElementById(
    "start"
).onclick = startGame;

document.getElementById(
    "pause"
).onclick = pauseGame;

document.getElementById(
    "restart"
).onclick = restartGame;


/* GAME LOOP */

function loop(){

    draw();

    if(running && !paused){

        movePlayer();
        moveAI();
        moveBall();

    }

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
  </html>
